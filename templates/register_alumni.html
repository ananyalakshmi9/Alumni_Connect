<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-t">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Alumni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 mt-5">
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Register as a New Alumnus</h3>
                        <p class="text-center text-muted">Calls `sp_RegisterAlumni` procedure.</p>
                        
                        <form action="/register_alumni" method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="alumni_id" class="form-label">Alumni ID (e.g., PES2UG19CS001)</label>
                                    <input type="text" class="form-control" id="alumni_id" name="alumni_id" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="grad_year" class="form-label">Graduation Year (e.g., 2023)</label>
                                    <input type="number" class="form-control" id="grad_year" name="grad_year" min="1990" max="2024" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="Fname" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="Fname" name="Fname" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="Lname" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="Lname" name="Lname" required>
                                </div>
                            </div>
                             <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="phone_number" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone_number" name="phone_number">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dept_id" class="form-label">Department ID (e.g., 1 for CS)</label>
                                    <input type="number" class="form-control" id="dept_id" name="dept_id" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="job_title" class="form-label">Job Title</label>
                                <input type="text" class="form-control" id="job_title" name="job_title">
                            </div>
                            <div class="mb-3">
                                <label for="current_company" class="form-label">Current Company</label>
                                <input type="text" class="form-control" id="current_company" name="current_company">
                            </div>
                             <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Register</button>
                                <a href="/login" class="btn btn-outline-secondary">Back to Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
