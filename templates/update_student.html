<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-t">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 mt-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Update Student (Update)</h3>
                        
                        <form action="/student/update" method="POST">
                            
                            <input type="hidden" name="student_id" value="{{ student[0] }}">
                            
                            <div class="mb-3">
                                <label class_name="form-label">Student ID</label>
                                <input type="text" class="form-control" value="{{ student[0] }}" disabled>
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="name" name="name" value="{{ student[1] }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="enroll_year" class="form-label">Enrollment Year</label>
                                <input type="number" class="form-control" id="enroll_year" name="enroll_year" value="{{ student[2] }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" value="{{ student[3] }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" name="phone" value="{{ student[4] }}">
                            </div>
                            <div class="mb-3">
                                <label for="dept_id" class="form-label">Department ID</label>
                                <input type="number" class="form-control" id="dept_id" name="dept_id" value="{{ student[5] }}" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">Save Changes</button>
                                <a href="/students" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
